<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%kdrishti-sidebar-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#112336" />
    <meta name="description" content="K-Drishti — See the issue. Track the action. A civic-tech platform for Kanpur." />
    <title>K-Drishti — See the issue. Track the action.</title>
    <script>
      (() => {
        const key = 'kdrishti-theme'
        const saved = localStorage.getItem(key)
        const theme = saved === 'dark' || saved === 'light'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
